name: Verificar bibliotecas externas
on:
  workflow_dispatch:
  push:
    branches:
      - seguranca-dependencias-2026-11
    paths:
      - 'index.html'
      - 'scripts/verificar_dependencias.py'
      - 'scripts/verificar_sintaxe.py'
      - 'scripts/preparar_sri.py'
      - '.github/workflows/verificar-dependencias.yml'
jobs:
  validar-cdn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe JavaScript
        run: python3 scripts/verificar_sintaxe.py
      - name: Validar URLs e calcular hashes SHA-384
        run: python3 scripts/verificar_dependencias.py
      - name: Gerar prévia com SRI
        run: python3 scripts/preparar_sri.py
      - name: Validar sintaxe da prévia
        run: |
          cp index.html index.original.html
          cp index.sri-preview.html index.html
          python3 scripts/verificar_sintaxe.py
          mv index.original.html index.html
      - name: Disponibilizar prévia para revisão
        uses: actions/upload-artifact@v4
        with:
          name: match-de-vagas-sri-preview
          path: index.sri-preview.html
          retention-days: 7
